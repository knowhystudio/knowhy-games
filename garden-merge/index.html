<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>花园合并 · 让美好慢慢生长</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#405b47;background:#edf4e6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#fff9e8,transparent 55%),radial-gradient(ellipse at 90% 80%,#fbe5e8,transparent 50%);padding:30px 16px}main{max-width:580px;margin:auto}header{text-align:center}small{font-size:12px;letter-spacing:4px;color:#7d9678}h1{font-size:34px;letter-spacing:5px;margin:8px 0}header p{font-size:14px;color:#7b8c78;margin:0 0 24px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}.stat{background:#ffffffa8;border:1px solid #fff;border-radius:18px;padding:12px;text-align:center;box-shadow:0 4px 12px #486e3710}.stat span{display:block;font-size:12px;color:#73876c}.stat strong{display:block;font-size:25px;margin-top:3px}.garden{padding:16px;background:#cbdcba;border:5px solid #dce8cc;border-radius:28px;box-shadow:0 12px 0 #b7cba7,0 22px 40px #617c3c19}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;touch-action:none;user-select:none}.cell{appearance:none;border:0;padding:0;aspect-ratio:1;border-radius:12px;background:#fff8e9;position:relative;font-size:clamp(19px,5.5vw,35px);display:grid;place-items:center;box-shadow:inset 0 -3px 0 #d8cdbb40;cursor:default;color:inherit}.cell:nth-child(16n+2),.cell:nth-child(16n+4),.cell:nth-child(16n+6),.cell:nth-child(16n+8),.cell:nth-child(16n+9),.cell:nth-child(16n+11),.cell:nth-child(16n+13),.cell:nth-child(16n+15){background:#f7e4df}.cell.filled{cursor:grab}.cell.selected{outline:3px solid #789d63;outline-offset:-3px;background:#e5efcf}.cell.target{outline:3px dashed #90aa75;outline-offset:-3px}.cell:focus-visible,button:focus-visible{outline:3px solid #628a5b;outline-offset:2px}.cell.clearing{animation:bloom .3s ease forwards}@keyframes bloom{50%{transform:scale(1.2);background:#fff1b9}100%{transform:scale(.1);opacity:0}}.below{display:flex;align-items:center;justify-content:space-between;margin:25px 2px 14px;gap:12px}.next{font-size:12px;color:#76846a}.next span{font-size:24px;letter-spacing:6px;display:block;margin-top:4px}button.action{border:0;border-radius:14px;background:#78966a;color:white;padding:12px 18px;font:inherit;font-size:14px;cursor:pointer;box-shadow:0 3px 0 #5e7a52}.message{min-height:24px;text-align:center;font-size:14px;color:#687e57;margin:16px 0}.rules{background:#ffffff80;border-radius:18px;padding:16px 20px;font-size:13px;line-height:1.9;color:#75816e}.rules b{color:#526c48}.rules p{margin:3px 0}.footer{text-align:center;font-size:12px;letter-spacing:2px;color:#8e9b82;margin:20px 0}dialog{border:0;border-radius:28px;background:#fffaf0;color:#405b47;padding:32px;text-align:center;width:min(360px,90vw);box-shadow:0 25px 80px #20352030}dialog::backdrop{background:#405b4766;backdrop-filter:blur(4px)}dialog h2{margin:10px}dialog strong{font-size:38px;display:block;margin:12px}.ghost{position:fixed;pointer-events:none;z-index:10;font-size:38px;transform:translate(-50%,-60%);filter:drop-shadow(0 8px 5px #405b4733)}@media(max-width:400px){body{padding:20px 10px}.garden{padding:10px;border-width:4px;border-radius:20px}.board{gap:4px}.cell{border-radius:8px}h1{font-size:29px}.rules{padding:12px}}
body{padding:max(16px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}small,.stat span,.next,.footer{font-size:13px}.garden{padding:4px;border-width:3px}.board{gap:1px}.cell{border-radius:7px;min-width:0}.cell .level{position:absolute;bottom:1px;right:2px;font-size:13px;line-height:1;color:#405b47}.action,.tool{min-height:44px}.tools{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}.tool{border:0;border-radius:12px;background:#e1ecd5;color:#405b47;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}.tool[aria-pressed=true]{outline:3px solid #789d63}.tool:disabled{opacity:.55}.dialog-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.hint{outline:3px dashed #d4a34b;outline-offset:-3px}@media(max-width:400px){body{padding-left:max(4px,env(safe-area-inset-left));padding-right:max(4px,env(safe-area-inset-right))}.garden{padding:3px;border-width:2px}.board{gap:1px}}@media(prefers-reduced-motion:reduce){.cell.clearing{animation:none;opacity:.3}}
</style>
</head>
<body><main>
<header><small>一方小园 · 一点闲暇</small><h1>🌷 花园合并</h1><p>把小小的花，连成满园的春天。</p></header>
<section class="stats" aria-label="游戏统计"><div class="stat"><span>花园得分</span><strong id="score">0</strong></div><div class="stat"><span>🌱 花园成长</span><strong id="growth">0</strong></div><div class="stat"><span>剩余空位</span><strong id="space">64</strong></div></section>
<div class="garden"><div id="board" class="board" role="group" aria-label="8 行 8 列花园棋盘"></div></div>
<div class="below"><div class="next">下一批小植物<span id="next"></span></div><button class="action" id="restart">重新开始 ↻</button></div>
<div class="tools" aria-label="花园工具"><button class="tool" id="shovel">铲子 1/2</button><button class="tool" id="sun">阳光 1/2</button><button class="tool" id="water">浇水壶 1/2</button><button class="tool" id="hint">找三连</button><button class="tool" id="sound">音效：开</button><button class="tool" id="reward" hidden>看广告获得道具</button></div><p class="message" id="message" role="status" aria-live="polite"></p>
<section class="rules"><b>✿ 花园手记</b><p>拖动植物到任意空格，也可先点植物，再点空格。</p><p>横、竖或斜向连成 3 个及以上相同图案即可消除，每格 10 分，每次消除成长 +1。</p><p>铲子清除一格；阳光让一株成长；浇水壶让所选植物及上下左右的植物成长。道具最多各 2 个。</p><p>移动后未消除，会长出 3 株新植物；新植物也能连线消除。棋盘满了，本次养花结束。</p></section><p class="footer">慢慢来，花会开的。 ✿</p>
</main>
<dialog id="confirm"><h2>重新开始？</h2><p>当前花园的进度将清零。</p><div class="dialog-actions"><button class="tool" id="cancel-restart">继续游戏</button><button class="action" id="confirm-restart">重新开始</button></div></dialog>
<dialog id="over" aria-labelledby="over-title"><div style="font-size:48px">💐</div><h2 id="over-title">花园已经开满啦</h2><p>收好这份春日的小小成果</p><strong id="final-score">0</strong><p id="final-growth"></p><button class="action" id="again">再来一局</button></dialog>
<script>
'use strict';
const icons=['🌷','🌼','🌸','🌿','🌵','💧'];
const names=['郁金香','雏菊','樱花','绿叶','仙人掌','水滴'];
const boardEl=document.getElementById('board');
let board=Array(64).fill(null),levels=Array(64).fill(0),score=0,growth=0,next=[],selected=null,busy=false,ended=false,drag=null,ghost=null,hover=null,tool=null,soundOn=true,inventory={shovel:1,sun:1,water:1};
// An advertising host may inject this adapter before this script runs. The default never loads an SDK or makes requests.
const ads=window.gardenAdsAdapter || {enabled:false,interstitial:async()=>{},rewarded:async()=>false};
let audioContext;
function playSound(){if(!soundOn)return;try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();const osc=audioContext.createOscillator(), gain=audioContext.createGain();osc.frequency.value=520;gain.gain.setValueAtTime(.04,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.12);osc.connect(gain).connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+.12);}catch(e){}}
function addTool(name){inventory[name]=Math.min(2,inventory[name]+1);}

const cells=Array.from({length:64},(_,i)=>{const el=document.createElement('button');el.type='button';el.className='cell';el.dataset.index=i;el.addEventListener('click',()=>activate(i));boardEl.append(el);return el;});
const randomType=()=>Math.floor(Math.random()*icons.length);
function render(){cells.forEach((el,i)=>{el.textContent=board[i]===null?'':icons[board[i]];if(board[i]!==null&&levels[i]){const badge=document.createElement('span');badge.className='level';badge.textContent=levels[i];el.append(badge);}el.className='cell'+(board[i]!==null?' filled':'')+(selected===i?' selected':'');el.setAttribute('aria-label',`第 ${Math.floor(i/8)+1} 行第 ${i%8+1} 列，${board[i]===null?'空格':names[board[i]]+'，成长 '+levels[i]}`);el.setAttribute('aria-pressed',String(selected===i));});document.getElementById('score').textContent=score;document.getElementById('growth').textContent=growth;document.getElementById('space').textContent=board.filter(v=>v===null).length;document.getElementById('next').textContent=next.map(v=>icons[v]).join('');for(const [key,label] of Object.entries({shovel:'铲子',sun:'阳光',water:'浇水壶'})){const b=document.getElementById(key);b.textContent=`${label} ${inventory[key]}/2`;b.setAttribute('aria-pressed',String(tool===key));}document.getElementById('reward').hidden=!ads.enabled;}
function say(text){document.getElementById('message').textContent=text;}
function matches(){const found=new Set();for(let i=0;i<64;i++){if(board[i]===null)continue;for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const line=[i];let r=Math.floor(i/8)+dr,c=i%8+dc;while(r>=0&&r<8&&c>=0&&c<8&&board[r*8+c]===board[i]){line.push(r*8+c);r+=dr;c+=dc;}if(line.length>=3)line.forEach(n=>found.add(n));}}return [...found];}
async function clearLines(){const line=matches();if(!line.length)return false;line.forEach(i=>cells[i].classList.add('clearing'));await new Promise(resolve=>setTimeout(resolve,300));line.forEach(i=>{board[i]=null;levels[i]=0;});const previousScore=score;score+=line.length*10;for(let n=Math.floor(previousScore/150);n<Math.floor(score/150);n++)addTool('sun');if(Math.random()<.2)addTool('shovel');growth++;playSound();render();say(`花开啦！消除 ${line.length} 格，+${line.length*10} 分 · 成长 +1 ✨`);return true;}
function plant(types){for(const type of types){const empty=board.flatMap((v,i)=>v===null?[i]:[]);if(!empty.length)break;board[empty[Math.floor(Math.random()*empty.length)]]=type;}}
async function move(from,to){if(busy||ended||from===to||board[from]===null||board[to]!==null)return;busy=true;selected=null;board[to]=board[from];levels[to]=levels[from];board[from]=null;levels[from]=0;render();try{if(!await clearLines()){plant(next);next=Array.from({length:3},randomType);render();if(!await clearLines())say('新植物探出头了，试试把相同图案连起来。');}if(board.every(v=>v!==null)){ended=true;document.getElementById('final-score').textContent=score+' 分';document.getElementById('final-growth').textContent=`花园成长了 ${growth} 次`;document.getElementById('over').showModal();}}finally{busy=false;}}
function activate(i){if(busy||ended)return;if(tool){if(board[i]===null){say('请选择有植物的格子。');return;}if(!inventory[tool])return;inventory[tool]--;if(tool==='shovel'){board[i]=null;levels[i]=0;}else if(tool==='sun'){levels[i]++;}else{for(const [dr,dc] of [[0,0],[-1,0],[1,0],[0,-1],[0,1]]){const r=Math.floor(i/8)+dr,c=i%8+dc;if(r>=0&&r<8&&c>=0&&c<8&&board[r*8+c]!==null)levels[r*8+c]++;}}tool=null;selected=null;playSound();render();say('道具使用成功。');return;}if(board[i]!==null){selected=selected===i?null:i;render();say(selected===null?'挑一株植物，开始整理小花园。':'已选中，点一个空格种下它。');}else if(selected!==null)void move(selected,i);}
function cleanup(){if(ghost)ghost.remove();if(hover!==null)cells[hover].classList.remove('target');ghost=null;hover=null;drag=null;}
boardEl.addEventListener('pointerdown',e=>{const cell=e.target.closest('.cell');if(!cell||busy||ended||e.button!==0||board[+cell.dataset.index]===null||tool||drag)return;drag={id:e.pointerId,from:+cell.dataset.index,x:e.clientX,y:e.clientY,moved:false};cell.setPointerCapture(e.pointerId);});
boardEl.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){drag.moved=true;ghost=document.createElement('div');ghost.className='ghost';ghost.textContent=icons[board[drag.from]];document.body.append(ghost);}if(!drag.moved)return;ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';if(hover!==null)cells[hover].classList.remove('target');const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');hover=target&&boardEl.contains(target)&&board[+target.dataset.index]===null?+target.dataset.index:null;if(hover!==null)cells[hover].classList.add('target');});
boardEl.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const {from,moved}=drag;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');cleanup();if(moved){suppressUntil=performance.now()+400;e.preventDefault();if(target&&boardEl.contains(target))void move(from,+target.dataset.index);}});
let suppressUntil=0;
boardEl.addEventListener('click',e=>{if(e.detail&&performance.now()<suppressUntil)e.stopImmediatePropagation();},true);
boardEl.addEventListener('pointercancel',cleanup);boardEl.addEventListener('lostpointercapture',cleanup);
function start(){if(busy)return;cleanup();board=Array(64).fill(null);levels=Array(64).fill(0);score=0;growth=0;selected=null;tool=null;inventory={shovel:1,sun:1,water:1};ended=false;next=Array.from({length:3},randomType);plant(Array.from({length:12},randomType));while(matches().length){matches().forEach(i=>board[i]=null);plant(Array.from({length:12-board.filter(v=>v!==null).length},randomType));}if(document.getElementById('over').open)document.getElementById('over').close();render();say('欢迎来到小花园，拖动一株植物试试吧。');}
for(const key of ['shovel','sun','water'])document.getElementById(key).addEventListener('click',()=>{if(busy||ended)return;if(!inventory[key]){say('这个道具用完啦。');return;}tool=tool===key?null:key;selected=null;render();say(tool?'请选择一株植物使用道具。':'已取消道具。');});
document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent='音效：'+(soundOn?'开':'关');});
document.getElementById('hint').addEventListener('click',()=>{if(busy||ended)return;tool=null;for(let from=0;from<64;from++){if(board[from]===null)continue;for(let to=0;to<64;to++){if(board[to]!==null)continue;board[to]=board[from];board[from]=null;const line=matches();board[from]=board[to];board[to]=null;if(line.length){selected=from;render();cells[to].classList.add('hint');say('试试把选中的植物移到虚线格。');return;}}}say('暂时没有可直接连成三株的移动。');});
document.getElementById('reward').addEventListener('click',async()=>{if(busy||ended)return;const name=prompt('想获得哪种道具？请输入 铲子、阳光 或 浇水壶');const key={'铲子':'shovel','阳光':'sun','浇水壶':'water'}[name];if(!key)return;if(inventory[key]>=2){say('这个道具已经达到上限。');return;}busy=true;try{if(await ads.rewarded(key))addTool(key);}catch(e){say('广告暂不可用。');}finally{busy=false;render();}});
document.getElementById('restart').addEventListener('click',()=>{if(!busy&&!ended)document.getElementById('confirm').showModal();});document.getElementById('cancel-restart').addEventListener('click',()=>document.getElementById('confirm').close());document.getElementById('confirm-restart').addEventListener('click',()=>{document.getElementById('confirm').close();start();});document.getElementById('again').addEventListener('click',async()=>{if(busy)return;busy=true;try{await ads.interstitial();}catch(e){}finally{busy=false;start();}});document.getElementById('over').addEventListener('cancel',e=>e.preventDefault());start();
</script></body></html>
