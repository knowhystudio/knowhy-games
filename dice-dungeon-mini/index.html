<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark">
<title>骰子地牢小局</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101725;color:#f8f3e8;font:16px/1.5 system-ui,-apple-system,sans-serif}main{max-width:440px;margin:auto;padding:18px 16px 30px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:22px;margin:0}h2{font-size:19px;margin:0 0 8px}.tag{font-size:13px;color:#b9c7dc}.panel{background:#1b283a;border:1px solid #35465b;border-radius:18px;padding:16px;margin-top:12px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{flex:1;min-width:88px;background:#25364b;border-radius:10px;padding:8px;text-align:center;font-size:14px}.map{display:flex;gap:8px;margin:14px 0}.room{height:9px;flex:1;border-radius:8px;background:#3a4c61}.room.done{background:#7ed5b1}.room.current{background:#ffd176}.enemy{text-align:center;padding:6px}.monster{font-size:52px;line-height:1.2}.health{height:10px;border-radius:10px;background:#3c4656;overflow:hidden;margin:8px auto;max-width:240px}.health span{display:block;height:100%;background:#f4867c}.dice{display:flex;justify-content:center;gap:10px;min-height:62px;align-items:center;margin:10px 0}.die{display:grid;place-items:center;width:54px;height:54px;border-radius:12px;background:#fff5df;color:#29364a;font-weight:800;font-size:25px;box-shadow:0 4px #c4b28e}.hint{color:#c3d0df;font-size:14px;text-align:center;min-height:21px}button{font:inherit;font-weight:700;min-height:46px;border:0;border-radius:12px;cursor:pointer;padding:10px 12px}button:focus-visible{outline:3px solid #fff;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}.primary{width:100%;background:#ffd176;color:#342611}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.items button{background:#344c64;color:#fff;font-size:14px}.choices{display:grid;gap:8px}.choices button{background:#344c64;color:#fff;text-align:left}.small{font-size:13px;color:#b9c7dc}.log{margin:0;min-height:42px;color:#d3dceb;font-size:14px}.bonus{width:100%;margin-top:8px;background:#35465b;color:white;font-size:14px}[hidden]{display:none!important}
</style>
</head>
<body><main>
<header><div><div class="tag">轻松冒险 · 一局三个房间</div><h1>🎲 骰子地牢小局</h1></div><span class="tag">单手可玩</span></header>
<section class="panel" aria-label="冒险状态"><div class="stats"><div class="stat">❤️ 生命 <strong id="hp"></strong></div><div class="stat">⚔️ 伤害 +<strong id="power"></strong></div><div class="stat">🎲 骰子 <strong id="diceCount"></strong></div></div><div class="map" id="map" aria-label="房间进度"></div><p class="log" id="log" aria-live="polite"></p></section>
<section class="panel" id="battle"><div class="enemy"><div class="tag" id="roomLabel"></div><div class="monster" id="monster"></div><h2 id="enemyName"></h2><div class="health"><span id="enemyBar"></span></div><div class="small" id="enemyHp"></div></div><div class="dice" id="dice"></div><div class="hint" id="hint"></div><button class="primary" id="action"></button></section>
<section class="panel" id="itemsPanel"><h2>冒险道具</h2><p class="small">每种最多 2 个 · 盾牌抵挡下一次伤害</p><div class="items"><button id="reroll">🎲 重掷 <span></span></button><button id="potion">🧪 药水 <span></span></button><button id="shield">🛡️ 盾牌 <span></span></button></div></section>
<section class="panel" id="upgrade" hidden><h2>✨ 房间通过！选择一项升级</h2><p class="small" id="treasure"></p><button class="bonus" id="bonus" hidden>观看激励广告，获得一个道具</button><div class="choices"><button data-upgrade="power">⚔️ 加伤害：每颗骰子伤害 +1</button><button data-upgrade="heal">❤️ 回血：恢复 4 点生命</button><button data-upgrade="dice">🎲 多一颗骰子：每次攻击多掷一颗</button></div></section>
<section class="panel" id="end" hidden><h2 id="endTitle"></h2><p id="endText"></p><button class="primary" id="restart">重新开始</button></section>
<p class="small">击败怪物前进；生命归零则本局结束。每个房间的宝藏会补充一种道具。</p>
</main>
<script>
'use strict';
// Host may set window.DiceDungeonAds before this script. No SDK or network is loaded here.
// Optional methods: showInterstitial() and showRewarded() => Promise<boolean>.
const ads = window.DiceDungeonAds || {};
const $ = id => document.getElementById(id);
const names = {reroll:'重掷',potion:'药水',shield:'盾牌'};
const enemies = [{name:'苔藓史莱姆',icon:'🟢',hp:9,attack:2},{name:'小骷髅',icon:'💀',hp:15,attack:3},{name:'宝箱守卫',icon:'👾',hp:21,attack:3}];
let game, busy = false;
function start(){game={room:0,hp:20,maxHp:20,power:0,diceCount:1,items:{reroll:1,potion:1,shield:1},shielded:false,rolls:[],phase:'roll',enemyHp:enemies[0].hp,cleared:0}; say('走进第一间房，掷骰迎战！'); render()}
function say(s){$('log').textContent=s}
function roll(){return Math.floor(Math.random()*6)+1}
function render(){const g=game,e=enemies[g.room]; $('hp').textContent=g.hp+'/'+g.maxHp; $('power').textContent=g.power; $('diceCount').textContent=g.diceCount; $('map').innerHTML=enemies.map((_,i)=>`<div class="room ${i<g.cleared?'done':i===g.room&&g.phase!=='end'?'current':''}"></div>`).join(''); $('map').setAttribute('aria-label',`已通过 ${g.cleared} / 3 个房间`); $('battle').hidden=g.phase==='upgrade'||g.phase==='end'; $('itemsPanel').hidden=g.phase==='upgrade'||g.phase==='end'; $('upgrade').hidden=g.phase!=='upgrade'; $('end').hidden=g.phase!=='end'; $('roomLabel').textContent=`房间 ${g.room+1} / 3`; $('monster').textContent=e.icon; $('enemyName').textContent=e.name; $('enemyHp').textContent=`怪物生命 ${Math.max(0,g.enemyHp)} / ${e.hp}`; $('enemyBar').style.width=Math.max(0,g.enemyHp)/e.hp*100+'%'; $('dice').innerHTML=g.rolls.map(n=>`<div class="die" aria-label="骰子 ${n}">${n}</div>`).join(''); $('hint').textContent=g.phase==='roll'?'掷骰后可以重掷一颗，再攻击。':`攻击伤害：${g.rolls.reduce((a,b)=>a+b,0)+g.power*g.rolls.length}`; $('action').textContent=g.phase==='roll'?'🎲 掷骰前进':'⚔️ 攻击'; for(const k of Object.keys(names)){$(k).querySelector('span').textContent=g.items[k]+'/2';$(k).disabled=busy||!g.items[k]||(k==='reroll'&&g.phase!=='attack')||(k==='potion'&&g.hp===g.maxHp)||(k==='shield'&&g.shielded)} $('action').disabled=busy; $('bonus').hidden=typeof ads.showRewarded!=='function'; $('bonus').disabled=busy||Object.values(g.items).every(n=>n>=2); }
function gainItem(){const available=Object.keys(names).filter(k=>game.items[k]<2); if(!available.length)return '道具已满'; const k=available[Math.floor(Math.random()*available.length)];game.items[k]++;return `获得 ${names[k]} ×1`}
$('action').onclick=()=>{const g=game;if(g.phase==='roll'){g.rolls=Array.from({length:g.diceCount},roll);g.phase='attack';say('骰子已掷出，可以使用重掷。')}else if(g.phase==='attack'){const damage=g.rolls.reduce((a,b)=>a+b,0)+g.power*g.rolls.length;g.enemyHp-=damage;g.rolls=[];if(g.enemyHp<=0){g.cleared++;const loot=gainItem();if(g.cleared===3){g.phase='end';$('endTitle').textContent='🏆 冒险胜利！';$('endText').textContent=`通过 3 个房间，找到最后的宝藏。${loot}。`;say('你打败了地牢守卫！')}else{g.phase='upgrade';$('treasure').textContent=`宝藏：${loot}。选择升级后进入下一间房。`;say(`击败怪物！${loot}。`)}}else{let hit=enemies[g.room].attack;if(g.shielded){g.shielded=false;hit=0}g.hp=Math.max(0,g.hp-hit);say(hit?`造成 ${damage} 点伤害，怪物反击造成 ${hit} 点伤害。`:`造成 ${damage} 点伤害，盾牌挡住了反击！`);if(!g.hp){g.phase='end';$('endTitle').textContent='💫 冒险结束';$('endText').textContent=`本局通过 ${g.cleared} 个房间。勇士可以重新出发！`}else g.phase='roll'}}render()};
$('reroll').onclick=()=>{if(game.phase!=='attack'||!game.items.reroll)return;game.items.reroll--;game.rolls[0]=roll();say('重掷了第一颗骰子。');render()};
$('potion').onclick=()=>{if(!game.items.potion||game.hp===game.maxHp)return;game.items.potion--;const n=Math.min(4,game.maxHp-game.hp);game.hp+=n;say(`使用药水，恢复 ${n} 点生命。`);render()};
$('shield').onclick=()=>{if(!game.items.shield||game.shielded)return;game.items.shield--;game.shielded=true;say('盾牌准备好了，将抵挡下一次伤害。');render()};
document.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>{const g=game;if(g.phase!=='upgrade'||busy)return;const u=b.dataset.upgrade;if(u==='power')g.power++;if(u==='heal')g.hp=Math.min(g.maxHp,g.hp+4);if(u==='dice')g.diceCount++;g.room++;g.enemyHp=enemies[g.room].hp;g.phase='roll';say('升级完成，进入下一间房！');render()});
$('bonus').onclick=async()=>{if(busy||game.phase!=='upgrade'||typeof ads.showRewarded!=='function'||Object.values(game.items).every(n=>n>=2))return;busy=true;render();try{if(await ads.showRewarded())say(`激励奖励：${gainItem()}。`);else say('未获得奖励。')}catch(e){say('广告不可用，未获得奖励。')}finally{busy=false;render()}};
$('restart').onclick=async()=>{if(busy||game.phase!=='end')return;busy=true;$('restart').disabled=true;try{if(typeof ads.showInterstitial==='function')await ads.showInterstitial()}catch(e){}finally{busy=false;$('restart').disabled=false;start()}};
start();
</script></body></html>
